<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>404 · 页面未找到  BA8AHG AR Website</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet"/>
<style>
    * {margin:0;padding:0;box-sizing:border-box;}

    body {
      background: linear-gradient(145deg, #0b1424 0%, #121e2f 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 1.5rem;
      color: #eef3fc;
    }

    .error-card {
      max-width: 720px;
      width: 100%;
      background: rgba(18, 30, 45, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(74, 144, 226, 0.25);
      border-radius: 2.5rem;
      box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 180, 255, 0.1) inset;
      padding: 3rem 2.5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .error-card::after {
      content: "";
      position: absolute;
      top: -30%;
      right: -20%;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle at 70% 20%, rgba(0, 180, 255, 0.08), transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .error-card > * {
      position: relative;
      z-index: 2;
    }

    .error-icon {
      font-size: 4.5rem;
      color: #5bb4ff;
      filter: drop-shadow(0 0 16px rgba(91, 180, 255, 0.35));
      margin-bottom: 1rem;
    }

    .error-code {
      font-size: 6rem;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #f0f9ff 0%, #c0e0ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.03em;
      margin-bottom: 0.3rem;
      text-shadow: 0 0 60px rgba(91, 180, 255, 0.15);
    }

    .error-title {
      font-size: 1.6rem;
      font-weight: 600;
      color: #d8ecff;
      margin-bottom: 0.8rem;
    }

    .error-desc {
      color: #b0c9e8;
      font-size: 1.05rem;
      line-height: 1.8;
      max-width: 480px;
      margin: 0 auto 2rem;
    }

    .error-desc i {
      color: #6db9ff;
      margin: 0 4px;
    }

    .divider-wave {
      color: #2a5f88;
      font-size: 1.2rem;
      margin-bottom: 1.8rem;
      letter-spacing: 8px;
    }

    .action-group {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      padding: 1rem 1.8rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
      border: 1px solid rgba(84, 155, 255, 0.24);
    }

    .action-btn.primary {
      background: #1e4f77;
      color: #fff;
      border-bottom: 4px solid #0a1a2a;
      box-shadow: 0 8px 0 #0a1a2a;
      transform: translateY(-2px);
    }

    .action-btn.primary:hover {
      background: #256a9c;
      transform: translateY(0);
      box-shadow: 0 6px 0 #0a1a2a;
    }

    .action-btn.primary:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #0a1a2a;
    }

    .action-btn.secondary {
      background: rgba(24, 42, 70, 0.95);
      color: #eef7ff;
      border-color: rgba(94, 161, 255, 0.18);
    }

    .action-btn.secondary:hover {
      transform: translateY(-1px);
      background: rgba(34, 66, 107, 0.96);
      box-shadow: 0 18px 36px -20px rgba(38, 113, 201, 0.5);
    }

    .footer-73 {
      margin-top: 2.5rem;
      color: #5f83a8;
      font-size: 0.85rem;
      border-top: 1px dashed #234a6b;
      padding-top: 1.5rem;
    }

    .footer-73 i {
      color: #4a90d0;
      margin: 0 4px;
    }

    .hint-box {
      background: rgba(8, 22, 38, 0.6);
      border-radius: 1.5rem;
      padding: 1.2rem 1.5rem;
      margin: 1.5rem auto 0;
      max-width: 420px;
      border: 1px solid rgba(112, 165, 240, 0.12);
      color: #9bb9da;
      font-size: 0.9rem;
      line-height: 1.7;
    }

    .hint-box i {
      color: #f5c542;
      margin-right: 6px;
    }

    @media (max-width: 500px) {
      .error-card { padding: 2rem 1.2rem; }
      .error-code { font-size: 4.5rem; }
      .error-title { font-size: 1.3rem; }
      .error-icon { font-size: 3.2rem; }
      .action-btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-icon">
      <i class="fas fa-satellite-dish"></i>
    </div>

    <div class="error-code">404</div>
    <div class="error-title">频率失谐 · 页面未找到</div>

    <div class="error-desc">
      您请求的 <i class="fas fa-wave-square"></i> 频率上没有信号，<br>
      或者这个呼号从未出现过 — 请检查您的日志再试。
    </div>

    <div class="divider-wave">
      <i class="fas fa-ellipsis-h"></i> · · · <i class="fas fa-ellipsis-h"></i>
    </div>

    <div class="action-group">
      <a class="action-btn primary" href="./index.html">
        <i class="fas fa-home"></i> 返回首页
      </a>
      <a class="action-btn secondary" href="./sample.html">
        <i class="fas fa-search"></i> 查阅 QSO
      </a>
      <a class="action-btn secondary" href="./sendplan.html">
        <i class="fas fa-box-open"></i> 寄递计划
      </a>
    </div>

    <div class="hint-box">
      <i class="fas fa-lightbulb"></i>
      试试使用首页的查询功能，输入卡片编号（如 A20251001001DYZ）直接跳转。
    </div>

    <div class="footer-73">
      <i class="fas fa-radio"></i> 73 · BA8AHG AR Website
    </div>
  </div>
</body>
</html>
